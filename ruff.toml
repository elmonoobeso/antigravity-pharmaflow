# Comprobacion rapida antes de dar por cerrado cualquier cambio:
#   py -3.14 -m ruff check .
#
# F821 (nombre no definido) es la regla que habria detectado en segundos los
# crashes que dejo el refactor a modulos. Es la razon principal de este archivo.

target-version = "py314"
line-length = 140
exclude = ["_legacy"]

[lint]
select = ["F", "E9"]
# Sin excepciones: F403/F405 ('import *') vuelven a estar activas. Los imports
# comodin son los que impedian detectar nombres no definidos.
